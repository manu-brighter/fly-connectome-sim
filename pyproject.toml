[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-connectome-sim"
version = "0.1.0"
description = "Reproducible MaleCNS experiments for a fruit-fly event planner"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.5",
    "Pillow==12.3.0",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
fly-connectome-sim = "fly_connectome_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fly_connectome_sim.neural" = ["*.cpp", "*.json"]
"fly_connectome_sim.schemas" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
